apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mybookstore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: mybookstore/frontend:dev
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          env:
            - name: NGINX_PORT
              value: "80"
            - name: PROXY_PASS
              value: http://api-gateway:80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mybookstore
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80