apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: mybookstore

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: mybookstore
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: mybookstore
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: mybookstore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mybookstore
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      # ── MyBookstore microservices pod discovery ──
      # Discover each pod of every business microservice independently
      # instead of scraping the Kubernetes Service as a single target.
      # The `job` label is rewritten to the pod's `app` label so the Hypo
      # backend can query every service as job="<service-name>".
      - job_name: mybookstore-services
        metrics_path: /metrics

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - mybookstore

        relabel_configs:
          # Keep only the six business microservices.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: catalog-service|user-service|cart-service|order-service|review-service|wishlist-service

          # Services also expose gRPC ports (50051, 50052).
          # Only scrape the HTTP ports 5001-5006 (regex is fully anchored).
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "500[1-6]"

          # Preserve the pod name as a Prometheus label so replicas
          # can be observed independently.
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service

          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: job

      # ── Prometheus self-monitoring ──
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mybookstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mybookstore
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
