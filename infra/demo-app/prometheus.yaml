apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mybookstore
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # ── Catalog-service (the only service that already exposes /metrics) ──
      - job_name: catalog-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - catalog-service:5001
            labels:
              service: catalog-service

      # ── Prometheus self-monitoring ──
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mybookstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mybookstore
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
