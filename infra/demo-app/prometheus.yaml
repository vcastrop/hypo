apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: mybookstore

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: mybookstore
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: mybookstore
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: mybookstore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mybookstore
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # ── Catalog-service pod discovery ──
      # Discover each catalog-service pod independently instead of
      # scraping the Kubernetes Service as a single target.
      - job_name: catalog-service
        metrics_path: /metrics

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - mybookstore

        relabel_configs:
          # Keep only catalog-service pods.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: catalog-service

          # Catalog exposes both HTTP (5001) and gRPC (50051).
          # Only scrape the HTTP metrics endpoint.
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "5001"

          # Preserve the pod name as a Prometheus label so replicas
          # can be observed independently.
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          - target_label: service
            replacement: catalog-service

      # ── Prometheus self-monitoring ──
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mybookstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mybookstore
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
