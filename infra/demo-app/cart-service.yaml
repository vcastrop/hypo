apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: mybookstore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: mybookstore/cart-service:dev
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5003
              name: http
            - containerPort: 50052
              name: grpc

          env:
            - name: PORT
              value: "5003"
            - name: GRPC_PORT
              value: "50052"
            - name: CATALOG_URL
              value: http://catalog-service:5001
            - name: CATALOG_GRPC_URL
              value: catalog-service:50051
            - name: COMM_MODE
              value: grpc
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"

          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: mybookstore
spec:
  selector:
    app: cart-service
  ports:
    - name: http
      port: 5003
      targetPort: 5003
    - name: grpc
      port: 50052
      targetPort: 50052