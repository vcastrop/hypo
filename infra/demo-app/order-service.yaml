apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: mybookstore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: mybookstore/order-service:dev
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5004

          env:
            - name: PORT
              value: "5004"
            - name: DB_USER
              value: postgres
            - name: DB_PASS
              value: postgres
            - name: DB_HOST
              value: postgres-order
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: order_db
            - name: CATALOG_GRPC_URL
              value: catalog-service:50051
            - name: CART_GRPC_URL
              value: cart-service:50052
            - name: COMM_MODE
              value: grpc

          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: mybookstore
spec:
  selector:
    app: order-service
  ports:
    - port: 5004
      targetPort: 5004