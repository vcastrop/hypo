apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: mybookstore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: mybookstore/user-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
            - name: DB_USER
              value: postgres
            - name: DB_PASS
              value: postgres
            - name: DB_HOST
              value: postgres-user
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: user_db

          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: mybookstore
spec:
  selector:
    app: user-service
  ports:
    - port: 5002
      targetPort: 5002