apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: catalog-resource-stress
  namespace: mybookstore
spec:
  mode: one
  duration: "60s"
  selector:
    namespaces:
      - mybookstore
    labelSelectors:
      app: catalog-service
  stressors:
    cpu:
      workers: 1
      load: 80
    memory:
      workers: 1
      size: "128MiB"
