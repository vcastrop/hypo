#Acá es para pruebas locales, cambiar por la url de aws cuando esté despleagdo

spring.application.name=trafficgenerator
server.port=8080

# Bookstore API Gateway (Docker, puerto 80)
traffic.target.base-url=http://localhost
# "/" no existe en el gateway → 404. Pon una ruta real de tu API, ej: /api/books
traffic.target.path=/api/books
# Rutas GET de solo lectura, una por microservicio, para que Prometheus
# tenga tráfico real que medir en los 6 servicios (catalog, users, cart,
# orders, reviews, wishlists). Separadas por coma.
traffic.target.paths=/api/books,/api/users,/api/cart/1,/api/orders/1,/api/reviews/1,/api/wishlists/1
# Cada intervalo se envía 1 petición a cada ruta (200 ms → 5 req/s por servicio).
traffic.interval-ms=200
