events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        location /health {
            default_type text/plain;
            return 200 'ok';
        }

        location /api/books {
            set $upstream_catalog catalog_service:5001;
            proxy_pass http://$upstream_catalog;
        }

        location /api/users {
            set $upstream_user user_service:5002;
            proxy_pass http://$upstream_user;
        }

        location /api/cart {
            set $upstream_cart cart_service:5003;
            proxy_pass http://$upstream_cart;
        }

        location /api/orders {
            set $upstream_order order_service:5004;
            proxy_pass http://$upstream_order;
        }

        location /api/reviews {
            set $upstream_review review_service:5005;
            proxy_pass http://$upstream_review;
        }

        location /api/wishlists {
            set $upstream_wishlist wishlist_service:5006;
            proxy_pass http://$upstream_wishlist;
        }
    }
}
