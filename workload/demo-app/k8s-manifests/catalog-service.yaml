apiVersion: v1
kind: Service
metadata:
  namespace: app
  name: catalog-service
spec:
  type: ClusterIP
  selector:
    app: catalog-service
  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: app
  name: catalog-deployment
spec:
  selector:
    matchLabels:
      app: catalog-service
  replicas: 1
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
      - name: catalog-service
        image: rontxz/catalog:latest
        ports:
        - containerPort: 5001
        env:
        - name: PORT
          value: "5001"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASS
          value: "postgres"
        - name: DB_HOST
          value: "tu-rds-endpoint.aws.com" # Cambiar por el endpoint real de AWS RDS
        - name: DB_PORT
          value: "5432"
